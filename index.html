<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f97316">
  <meta name="description" content="الموقع الشخصي ليوسف أشرف — تواصل معايا.">
  <title>يوسف أشرف | تواصل معايا</title>
  <style>
    :root { color-scheme: light; --orange:#f97316; --deep:#c2410c; --ink:#24170f; --muted:#806b5c; }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
      font-family: Tahoma, Arial, sans-serif; color:var(--ink);
      background: radial-gradient(circle at 15% 15%, #fed7aa 0, transparent 32%),
                  linear-gradient(145deg,#fff7ed,#ffedd5 55%,#fff);
    }
    main {
      width:min(100%,720px); text-align:center; padding:clamp(32px,7vw,64px) 24px;
      background:rgba(255,255,255,.88); border:1px solid #ffedd5; border-radius:32px;
      box-shadow:0 24px 70px rgba(124,45,18,.12);
    }
    .mark {
      width:76px;height:76px;margin:0 auto 24px;display:grid;place-items:center;
      border-radius:24px;background:linear-gradient(145deg,#fb923c,var(--deep));
      color:white;font-size:34px;font-weight:800;box-shadow:0 12px 28px #f9731640;
    }
    .eyebrow { color:var(--deep);font-weight:700;letter-spacing:.04em;margin:0 0 12px; }
    h1 { font-size:clamp(2.2rem,8vw,4.2rem);margin:0;line-height:1.2; }
    h1 span { color:var(--orange); }
    .intro { max-width:470px;margin:20px auto 30px;color:var(--muted);font-size:1.1rem;line-height:1.9; }
    .contact {
      display:inline-flex;align-items:center;justify-content:center;gap:10px;
      min-height:54px;padding:0 28px;border-radius:16px;
      color:#fff;background:#b9b1aa;font-weight:700;text-decoration:none;
      cursor:not-allowed;box-shadow:0 8px 20px #24170f14;
    }
    .contact svg { width:21px;height:21px;fill:currentColor; }
    .note { margin:16px auto 0;max-width:440px;font-size:.88rem;line-height:1.8;color:#8a7566; }
    footer { margin-top:42px;color:#a18b7b;font-size:.8rem; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">ي</div>
    <p class="eyebrow">أهلاً بيك في موقعي</p>
    <h1>أنا <span>يوسف أشرف</span></h1>
    <p class="intro">حابب تتواصل معايا؟ يسعدني إنك وصلت للموقع.</p>
    <a class="contact" aria-disabled="true" tabindex="-1">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 3.5A11.8 11.8 0 0 0 12.1 0C5.6 0 .3 5.3.3 11.8c0 2.1.6 4.2 1.6 6L0 24l6.4-1.7a11.8 11.8 0 0 0 5.7 1.5h.1c6.5 0 11.8-5.3 11.8-11.8 0-3.2-1.2-6.2-3.5-8.5ZM12.1 21.8c-1.8 0-3.5-.5-5-1.4l-.4-.2-3.8 1 1-3.7-.3-.4a9.8 9.8 0 1 1 8.5 4.7Zm5.4-7.3c-.3-.1-1.7-.8-2-.9-.3-.1-.5-.1-.7.2-.2.3-.8.9-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.2-.5-2.3-1.4-.8-.7-1.4-1.6-1.6-1.9-.2-.3 0-.5.1-.6l.4-.5.3-.5c.1-.2 0-.4 0-.5l-.9-2.1c-.2-.5-.5-.4-.7-.4h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.4s1 2.8 1.1 3c.1.2 2 3.1 4.8 4.3.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.6-.1 1.7-.7 1.9-1.3.2-.6.2-1.1.2-1.3-.1-.2-.3-.3-.6-.4Z"/></svg>
      تواصل معايا
    </a>
    <p class="note">سيتم تفعيل زر واتساب عند إضافة رقم مخصص للتواصل العام بموافقة صاحبه وولي الأمر.</p>
    <footer>© <span id="year"></span> يوسف أشرف</footer>
  </main>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
